<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Hanggus</title>
		<style>
			body {
				margin: 0;
				background-color: rgb(0, 0, 0);
				color: rgb(255, 255, 255);
				font-family: Sans-serif;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
				overflow: hidden;
				user-select: none;
				cursor: pointer;
			}

			.screen {
				display: none;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				width: 100%;
				height: 100%;
			}

			.active {
				display: flex;
			}

			#startscreen {
				font-size: 4vw;
				animation: blink 1.5s infinite;
			}

			@keyframes blink {
				0%, 100% { opacity: 1; }
				50% { opacity: 0.4; }
			}

			#typingscreen {
				font-size: 6vw;
			}

			.gamecontainer {
				display: flex;
				flex-direction: row;
				align-items: center;
				justify-content: center;
				gap: 80px;
			}

			.gameboard {
				display: flex;
				flex-direction: column;
				align-items: center;
			}

			#hpdisplay {
				font-size: 36px;
				margin-bottom: 40px;
			}

			#worddisplay {
				font-size: 6vw;
				letter-spacing: 15px;
				margin-bottom: 40px;
			}

			#feedbackdisplay {
				font-size: 30px;
			}

			#gameoverscreen {
				font-size: 36px;
				line-height: 50px;
				white-space: pre-line;
				}

			#gusdiv {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 15px;
			}

			#gustext {
				position: relative;
				width: 220px;
				height: 160px;
				background-color: white;
				color: black;
				text-align: center;
				font-size: 24px;
				font-weight: bold;
				padding: 15px;
				box-sizing: border-box;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: 20px;
				margin: 0;
			}

			#gustext::after {
				content: '';
				position: absolute;
				bottom: -15px;
				left: 50%;
				transform: translateX(-50%);
				border-width: 15px 15px 0;
				border-style: solid;
				border-color: white transparent;
				display: block;
				width: 0;
			}

			#gusimg, #guscanvas {
				width: 200px;
				height: auto;
			}

			#creditsbutton {
				position: fixed;
				top: 10px;
				right: 10px;
				z-index: 100;
				padding: 8px 16px;
				font-family: sans-serif;
				cursor: pointer;
			}
			.credits-hidden {
				display: none !important;
			}
			#creditsscreen {
				text-align: center;
				font-size: 24px;
				margin-top: 50px;
			}
			#lettersused {
				position: fixed;
				top: 10px;
				left: 10px;
				z-index: 101;
				padding: 8px 16px;
				font-family: sans-serif;
				cursor: pointer;
			}
			#score {
				position: fixed;
				top: 10px;
				z-index: 102;
				padding: 8px 16px;
				font-family: sans-serif;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<button id="creditsbutton" style="display: none;">Credits</button>
		<button id="lettersused" style="display: none;">letters used: </button>
		<button id="score" style="display: none;">score: 0</button>
		<div id="startscreen" class="screen active">
			click to start
		</div>
		<div id="typingscreen" class="screen"></div>
		<div id="playingscreen" class="screen">

				</div>
			</div>
		</div>
		<div id="gameoverscreen" class="screen"></div>
		<div id="creditsscreen" class="screen">
			<h2>credits</h2>
			<p>created by Alec Diramerian</p>
			<p>'Gus' created by Alec Diramerian, Sarah Quan, Kyra Covy</p>
			<p>song "It's me, I'm Gus" composed by Alec Diramerian</p>
			<p>with samples by Toby Fox</p>
		</div>
		<audio id="bgmusic" loop>
			<source src="./audio/itsmeimgus.mp3" type="audio/mpeg">
		</audio>
		<script>
			let gameState = 'clicktostart';
			let previousState = 'playing'; 
			let currentlength = 0;
			let counter = 0;
			let word = "";
			let guessed = [];
			let hp = 10;
			let guessedLetters = [];
			let lastFeedback = "press a key to guess";
			let winMsg = "";
			let nextWordTimer = 0;
			let timer;
			let score = 0;
			const typespeed = 10;
			const fullword = "Hanggus";
			const startScreen = document.getElementById('startscreen');
			const typingScreen = document.getElementById('typingscreen');
			const playingScreen = document.getElementById('playingscreen');
			const gameoverScreen = document.getElementById('gameoverscreen');
			const creditsScreen = document.getElementById('creditsscreen');
			const creditsButton = document.getElementById('creditsbutton');
			const hpDisplay = document.getElementById('hpdisplay');
			const wordDisplay = document.getElementById('worddisplay');
			const feedbackDisplay = document.getElementById('feedbackdisplay');
			const gusText = document.getElementById('gustext');
			const bgMusic = document.getElementById('bgmusic');
			const lettersUsed = document.getElementById('lettersused');
			const scoreelem = document.getElementById('score');


			const wordList = ["alec", "gus", "itsmeimgus", "poop", "six", "seven", "eat", "apple", "hamburger", "cookie", "monkey", "word", "stevens", "lime", "sam", "nelson", "pneumonoultramicroscopicsilicovolcanoconiosis", "giasfclfebrehber"];
			const possibleComments = ["dude please i sWEAR i didnt do it", "i gotta pee", "i am Bisexual", "im hungry", "any minute now", "i may have to get CHESTER on you bro", "please dude help me out i was kidding about your mom i bet shes great", "we're friends, right?", "i eat poop"];
			const hurtComments = ["HEY HEY WOAH WOAH WAIT", "NONONONONON STOP", "PLEASE BRO DONT LET ME DIE", "I WANT MY MOMMY!", "HEY WAIT STOP", "WHAT ARE YOU DOING!?!?!?", "HEY YOURE SUPPOSED TO BE SAVING ME???"];

			function pickNextWord() {
				word = wordList[Math.floor(Math.random() * wordList.length)];
				guessed = new Array(word.length).fill(0);
				guessedLetters = [];
				hp = 10;
				lastFeedback = "next word";
			}

			pickNextWord();

			window.addEventListener('click', (e) => {
				if (e.target === creditsButton) return;
				
				if (gameState === 'clicktostart') {
					gameState = 'typing';
					creditsButton.style.display = 'block'; 
					lettersUsed.style.display = 'block'; 
					scoreelem.style.display = 'block'; 
					bgMusic.play().catch(error => {
						console.log("audio fail lmao", error);
					});

					start();
				}
			});

			creditsButton.addEventListener('click', () => {
				if (gameState !== 'credits') {
					previousState = gameState;
					gameState = 'credits';
					creditsButton.innerText = "Back to Game";
				} else {
					gameState = previousState;
					creditsButton.innerText = "Credits";
				}
			});

			function start() {
				const startTimer = () => timer = setInterval(talk, 3000 + Math.random() * 6000);
				const talk = () => {
					if (gameState === 'credits') return; 
					gusText.innerText = possibleComments[Math.floor(Math.random() * possibleComments.length)];
					clearInterval(timer);
					startTimer();
				}
				
				window.addEventListener('keydown', (it) => {
					if (gameState !== 'playing') return;
					
					let lt = it.key.toLowerCase();
					if (lt.length !== 1 || lt < 'a' || lt > 'z') return;

					if (guessedLetters.includes(lt)) {
						lastFeedback = `you already guessed the letter ${lt}`;
						return; 
					}
					guessedLetters.push(lt);
					lettersUsed.innerText = `letters used: ${guessedLetters}`
					if (word.includes(lt)) {
						lastFeedback = "yea";
						
						for (let i = 0; i < word.length; i++) {
							if (word[i] === lt) {
								guessed[i] = 1;
								console.log(guessed)
							}
						}
					} else {
						hp -= 1;
						lastFeedback = "lol nope";
						gusText.innerText = hurtComments[Math.floor(Math.random() * hurtComments.length)];
						clearInterval(timer);
						startTimer();
						if (hp === 0) {
							gameState = 'gameover';
							winMsg = `you died lmao\nthe word was '${word}'\nlol you suck`;
							guessedLetters = [];
							setInterval(() => {
								window.location.reload();
							}, 5000);
						}
					}

					if (!guessed.includes(0) && gameState === 'playing') {	
						score += 1;
						hp = 10;
						guessedLetters = [];
						lastFeedback = `you got it`;
						lettersUsed.innerText = `letters used: ${guessedLetters}`;
						scoreelem.innerText = `score: ${score}`;
						gameState = 'nextwordpause';
						nextWordTimer = 0;
					}
				});

				function update() {
					startScreen.classList.remove('active');
					typingScreen.classList.remove('active');
					playingScreen.classList.remove('active');
					gameoverScreen.classList.remove('active');
					creditsScreen.classList.remove('active');

					if (gameState === 'clicktostart') {
						startScreen.classList.add('active');
					}
					else if (gameState === 'typing') {
						typingScreen.classList.add('active');
						
						counter++;
						if (counter >= typespeed && currentlength <= fullword.length) {
							currentlength++;
							counter = 0;
						}

						const typed = fullword.slice(0, currentlength);
						const remaining = fullword.length - typed.length;
						const underscore = "_".repeat(remaining);
						const word2paste = typed + underscore;

						if (word2paste.length > 0) {
							typingScreen.innerText = word2paste;
						}

						if (currentlength > fullword.length) {
							counter++;
							if (counter > 60) {
								gameState = 'playing';
							}
						}
					}
					else if (gameState === 'playing' || gameState === 'nextwordpause') {
						playingScreen.classList.add('active');
						
						hpDisplay.innerText = `guesses: ${hp} / 10`;

						let display = "";
						for (let i = 0; i < word.length; i++) {
							display += guessed[i] === 1 ? word[i] + " " : "_ ";
						}
						wordDisplay.innerText = display.trim();
						feedbackDisplay.innerText = lastFeedback;

						if (gameState === 'nextwordpause') {
							nextWordTimer++;
							if (nextWordTimer > 90) {
								pickNextWord();
								gameState = 'playing';
							}
						}
					}
					else if (gameState === 'gameover') {
						gameoverScreen.classList.add('active');
						gameoverScreen.innerText = winMsg;
						creditsButton.style.display = 'none'; 
						lettersUsed.style.display = 'none'; 

					}
					else if (gameState === 'credits') {
						creditsScreen.classList.add('active');
					}
					requestAnimationFrame(update);
				}
				update();
				startTimer();
			}

			function prestartUpdate() {
				if (gameState === 'clicktostart') {
					requestAnimationFrame(prestartUpdate);
				}
			}
			prestartUpdate();
		</script>
	</body>
</html>
